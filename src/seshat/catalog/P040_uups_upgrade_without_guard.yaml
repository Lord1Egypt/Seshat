id: P040
name: 'UUPS Upgrade Without Guard'
severity: high
category: PROXY_UPGRADEABLE
confidence: 0.6
swc: SWC-105
cwe: CWE-284
detectors:
  - type: function_signature
    pattern: 'function\s+upgradeTo\w*\s*\('
    scope: function
    requires:
      - '\b(public|external)\b'
    forbids:
      - 'only[A-Za-z]\w*'
      - 'hasRole'
      - '_checkRole'
      - '_checkOwner'
      - 'require\s*\(\s*msg\.sender'
      - 'msg\.sender\s*==\s*owner'
      - '_authorizeUpgrade'
    confidence: 0.6
    description: 'upgradeTo exposed without an upgrade guard'
tests:
  positive:
    - 'contract C { address impl; function upgradeTo(address n) public { impl = n; } }'
  negative:
    - 'contract C { address impl; function upgradeTo(address n) public onlyOwner { impl = n; } }'
    - 'contract Safe { uint256 private value; function getValue() external view returns (uint256) { return value; } }'
