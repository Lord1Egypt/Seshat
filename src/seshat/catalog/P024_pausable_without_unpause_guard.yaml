id: P024
name: 'Pausable Without Unpause Guard'
severity: high
category: ACCESS_CONTROL
confidence: 0.55
swc: SWC-105
cwe: CWE-284
detectors:
  - type: function_signature
    pattern: 'function\s+unpause\s*\('
    scope: function
    requires:
      - '\b(public|external)\b'
    forbids:
      - 'only[A-Za-z]\w*'
      - 'hasRole'
      - '_checkRole'
      - '_checkOwner'
      - 'require\s*\(\s*msg\.sender'
      - 'msg\.sender\s*==\s*owner'
    confidence: 0.55
    description: 'unpause() without a guard'
tests:
  positive:
    - 'contract C { bool p; function unpause() public { p=false; } }'
  negative:
    - 'contract C { bool p; function unpause() public onlyOwner { p=false; } }'
    - 'contract Safe { uint256 private value; function getValue() external view returns (uint256) { return value; } }'
