id: P144
name: 'Unchecked delegatecall Return'
severity: high
category: EXTERNAL_CALLS
confidence: 0.55
swc: SWC-104
cwe: CWE-252
detectors:
  - type: regex
    pattern: '^\s*[^=]*\.delegatecall\s*\('
    confidence: 0.55
    description: 'delegatecall result not checked'
tests:
  positive:
    - 'contract C { function f(address t, bytes calldata d) public { t.delegatecall(d); } }'
  negative:
    - 'contract C { function f(address t, bytes calldata d) public { (bool ok,)=t.delegatecall(d); require(ok); } }'
    - 'contract Safe { uint256 private value; function getValue() external view returns (uint256) { return value; } }'
