id: P012
name: 'Signature Replay (No Nonce)'
severity: high
category: SIGNATURE_CRYPTO
confidence: 0.5
swc: SWC-121
cwe: CWE-294
detectors:
  - type: regex
    pattern: 'ecrecover\s*\('
    forbids:
      - 'nonce'
      - '_nonces'
    confidence: 0.5
    description: 'ecrecover-based auth without a replay nonce'
tests:
  positive:
    - 'contract C { function f(bytes32 h, uint8 v, bytes32 r, bytes32 s) public { address a = ecrecover(h, v, r, s); } }'
  negative:
    - 'contract C { mapping(address=>uint) nonce; function f(bytes32 h, uint8 v, bytes32 r, bytes32 s) public { address a = ecrecover(h, v, r, s); nonce[a]++; } }'
    - 'contract Safe { uint256 private value; function getValue() external view returns (uint256) { return value; } }'
