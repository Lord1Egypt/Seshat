id: P047
name: 'Unprotected Implementation Setter'
severity: critical
category: PROXY_UPGRADEABLE
confidence: 0.7
swc: SWC-105
cwe: CWE-284
detectors:
  - type: function_signature
    pattern: 'function\s+\w*set(Implementation|Impl|Beacon)\w*\s*\('
    scope: function
    requires:
      - '\b(public|external)\b'
    forbids:
      - 'only[A-Za-z]\w*'
      - 'hasRole'
      - '_checkRole'
      - '_checkOwner'
      - 'require\s*\(\s*msg\.sender'
      - 'msg\.sender\s*==\s*owner'
    confidence: 0.7
    description: 'Proxy/beacon implementation pointer setter without an access guard'
tests:
  positive:
    - 'contract P { address impl; function setImplementation(address i) external { impl = i; } }'
  negative:
    - 'contract P { address impl; function setImplementation(address i) external onlyOwner { impl = i; } }'
    - 'contract Safe { uint256 private value; function getValue() external view returns (uint256) { return value; } }'
