id: P152
name: 'require Without Message'
severity: low
category: BUSINESS_LOGIC
confidence: 0.3
swc: SWC-000
cwe: CWE-778
detectors:
  - type: regex
    pattern: 'require\s*\([^,)]*\)\s*;'
    confidence: 0.3
    description: 'require without a revert message'
tests:
  positive:
    - 'contract C { function f(uint a) public pure { require(a > 0); } }'
  negative:
    - 'contract C { function f(uint a) public pure { require(a > 0, "too small"); } }'
    - 'contract Safe { uint256 private value; function getValue() external view returns (uint256) { return value; } }'
