id: P001
name: 'Unprotected Mint'
severity: critical
category: ACCESS_CONTROL
confidence: 0.8
swc: SWC-105
cwe: CWE-284
detectors:
  - type: function_signature
    pattern: 'function\s+\w*[mM]int\w*\s*\('
    scope: function
    requires:
      - '\b(public|external)\b'
    forbids:
      - 'only[A-Za-z]\w*'
      - 'hasRole'
      - '_checkRole'
      - '_checkOwner'
      - 'require\s*\(\s*msg\.sender'
      - 'msg\.sender\s*==\s*owner'
      - 'MINTER_ROLE'
    confidence: 0.8
    description: 'Public/external mint without an owner/role guard'
tests:
  positive:
    - 'contract C { mapping(address=>uint) b; function mint(address to, uint a) public { b[to]+=a; } }'
  negative:
    - 'contract C { mapping(address=>uint) b; function mint(address to, uint a) public onlyOwner { b[to]+=a; } }'
    - 'contract C { mapping(address=>uint) b; function _mint(address to, uint a) internal { b[to]+=a; } }'
