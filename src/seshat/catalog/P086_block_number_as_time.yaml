id: P086
name: 'Block Number As Time'
severity: medium
category: TIME_RANDOMNESS
confidence: 0.4
swc: SWC-116
cwe: CWE-682
detectors:
  - type: regex
    pattern: 'block\.number\s*[*+/-]|[*+/-]\s*block\.number'
    confidence: 0.4
    description: 'block.number used in time arithmetic'
tests:
  positive:
    - 'contract C { function f() public view returns (uint) { return block.number * 13; } }'
  negative:
    - 'contract Safe { uint256 private value; function getValue() external view returns (uint256) { return value; } }'
