id: P044
name: 'Staticcall With Assumed Side Effects'
severity: medium
category: EXTERNAL_CALLS
confidence: 0.4
swc: SWC-104
cwe: CWE-252
detectors:
  - type: regex
    pattern: '^\s*[^=]*\.staticcall\s*\('
    confidence: 0.4
    description: 'staticcall result unchecked'
tests:
  positive:
    - 'contract C { function f(address t) public view { t.staticcall(""); } }'
  negative:
    - 'contract C { function f(address t) public view { (bool ok,)=t.staticcall(""); require(ok); } }'
    - 'contract Safe { uint256 private value; function getValue() external view returns (uint256) { return value; } }'
