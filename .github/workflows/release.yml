# Build distributable artifacts on a version tag (e.g. `git tag v1.0.0 && git push --tags`).
# Builds the wheel/sdist and standalone single-file binaries for Linux/macOS/Windows,
# then attaches everything to the GitHub Release.
#
# Publishing to PyPI is intentionally NOT automated here — run `twine upload dist/*`
# (or wire a trusted-publishing job) when you're ready. Nothing here pushes outward
# except attaching build artifacts to the tag's own GitHub Release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  binaries:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build standalone binary (PyInstaller)
        run: |
          python -m pip install --upgrade pyinstaller .
          pyinstaller --onefile --name seshat --collect-data seshat tools/seshat_entry.py
      - name: Name binary per OS (avoid asset name collisions)
        shell: bash
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = "Windows" ]; then
            mv dist/seshat.exe out/seshat-windows.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then
            mv dist/seshat out/seshat-macos
          else
            mv dist/seshat out/seshat-linux
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: seshat-${{ matrix.os }}
          path: out/*

  release:
    needs: [dist, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach artifacts to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
