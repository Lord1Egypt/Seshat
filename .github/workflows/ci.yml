# Offline test + lint CI. This validates the code only — it never performs
# scanning. Seshat's scan path runs 100% locally and never depends on Actions.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package (no runtime deps)
        run: python -m pip install -e .
      - name: Unit tests (stdlib only, offline)
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff (dev tool)
        run: python -m pip install --upgrade ruff
      - name: Lint
        run: ruff check .

  rust:
    # Optional Rust performance core: build, parity (cargo test), and the
    # cross-engine parity check against the Python engine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build + parity tests (Rust)
        working-directory: rust
        run: |
          cargo build --release
          cargo test --release
      - name: Cross-engine parity (Python ↔ Rust)
        run: |
          python -m pip install -e .
          python -m unittest tests.test_rust_parity -v
