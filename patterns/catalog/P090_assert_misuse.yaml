id: P090
name: 'assert Misuse'
severity: medium
category: BUSINESS_LOGIC
confidence: 0.4
swc: SWC-110
cwe: CWE-617
detectors:
  - type: regex
    pattern: '\bassert\s*\('
    confidence: 0.4
    description: 'assert used for input validation (consumes all gas)'
tests:
  positive:
    - 'contract C { function f(uint a) public pure { assert(a > 0); } }'
  negative:
    - 'contract Safe { uint256 private value; function getValue() external view returns (uint256) { return value; } }'
