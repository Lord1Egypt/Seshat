id: P033
name: 'Rounding Direction Risk'
severity: medium
category: ARITHMETIC
confidence: 0.35
swc: SWC-101
cwe: CWE-682
detectors:
  - type: regex
    pattern: '\*\s*[\w().]+\s*/'
    confidence: 0.35
    description: 'Multiply-then-divide may round against the protocol'
tests:
  positive:
    - 'contract C { function f(uint a, uint b, uint c) public pure returns (uint) { return a * b / c; } }'
  negative:
    - 'contract Safe { uint256 private value; function getValue() external view returns (uint256) { return value; } }'
