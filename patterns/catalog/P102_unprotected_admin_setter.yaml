id: P102
name: 'Unprotected Admin Setter'
severity: critical
category: ACCESS_CONTROL
confidence: 0.75
swc: SWC-105
cwe: CWE-284
detectors:
  - type: function_signature
    pattern: 'function\s+set(Owner|Admin|Governance|Authority)\w*\s*\('
    scope: function
    requires:
      - '\b(public|external)\b'
    forbids:
      - 'only[A-Za-z]\w*'
      - 'hasRole'
      - '_checkRole'
      - '_checkOwner'
      - 'require\s*\(\s*msg\.sender'
      - 'msg\.sender\s*==\s*owner'
    confidence: 0.75
    description: 'Privileged role setter without a guard'
tests:
  positive:
    - 'contract C { address admin; function setAdmin(address a) public { admin=a; } }'
  negative:
    - 'contract C { address admin; function setAdmin(address a) public onlyOwner { admin=a; } }'
    - 'contract Safe { uint256 private value; function getValue() external view returns (uint256) { return value; } }'
