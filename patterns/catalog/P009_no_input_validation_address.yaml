id: P009
name: 'No Input Validation (Address)'
severity: medium
category: BUSINESS_LOGIC
confidence: 0.4
swc: SWC-000
cwe: CWE-20
detectors:
  - type: function_signature
    pattern: 'function\s+\w+\s*\([^)]*\baddress\b[^)]*\)'
    scope: function
    requires:
      - '\b(public|external)\b'
    forbids:
      - 'address\(0\)'
      - 'require\s*\('
    confidence: 0.4
    description: 'Address parameter used without a zero-address check'
tests:
  positive:
    - 'contract C { address a; function setA(address x) public { a = x; } }'
  negative:
    - 'contract C { address a; function setA(address x) public { require(x != address(0)); a = x; } }'
    - 'contract Safe { uint256 private value; function getValue() external view returns (uint256) { return value; } }'
