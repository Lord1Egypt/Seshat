id: P032
name: 'Precision Loss (Div Before Mul)'
severity: high
category: ARITHMETIC
confidence: 0.5
swc: SWC-101
cwe: CWE-682
detectors:
  - type: regex
    pattern: '/\s*[\w().]+\s*\*'
    confidence: 0.5
    description: 'Division before multiplication loses precision'
tests:
  positive:
    - 'contract C { function f(uint a, uint b) public pure returns (uint) { return a / b * 100; } }'
  negative:
    - 'contract C { function f(uint a, uint b) public pure returns (uint) { return a * 100 / b; } }'
    - 'contract Safe { uint256 private value; function getValue() external view returns (uint256) { return value; } }'
