id: P101
name: 'Unprotected Fund Sweep'
severity: high
category: ACCESS_CONTROL
confidence: 0.7
swc: SWC-105
cwe: CWE-284
detectors:
  - type: function_signature
    pattern: 'function\s+(withdraw|sweep|rescue|recover)\w*\s*\('
    scope: function
    requires:
      - '\b(public|external)\b'
      - '\.(transfer|call|send)\b'
    forbids:
      - 'only[A-Za-z]\w*'
      - 'hasRole'
      - '_checkRole'
      - '_checkOwner'
      - 'require\s*\(\s*msg\.sender'
      - 'msg\.sender\s*==\s*owner'
    confidence: 0.7
    description: 'Fund-moving sweep/withdraw without a guard'
tests:
  positive:
    - 'contract C { function sweep(address payable t) public { t.transfer(address(this).balance); } }'
  negative:
    - 'contract C { function sweep(address payable t) public onlyOwner { t.transfer(address(this).balance); } }'
    - 'contract Safe { uint256 private value; function getValue() external view returns (uint256) { return value; } }'
