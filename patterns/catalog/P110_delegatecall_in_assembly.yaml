id: P110
name: 'Delegatecall In Assembly'
severity: critical
category: EXTERNAL_CALLS
confidence: 0.65
swc: SWC-112
cwe: CWE-829
detectors:
  - type: regex
    pattern: 'assembly[^}]*delegatecall'
    multiline: true
    confidence: 0.65
    description: 'delegatecall via inline assembly'
tests:
  positive:
    - 'contract C { function f(address t) public { assembly { let r := delegatecall(gas(), t, 0, 0, 0, 0) } } }'
  negative:
    - 'contract Safe { uint256 private value; function getValue() external view returns (uint256) { return value; } }'
